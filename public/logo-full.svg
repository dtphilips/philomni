<svg width="240" height="64" viewBox="0 0 240 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Philomni">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Icon: 64×64 rounded square with gradient -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#grad)"/>

  <!--
    P lettermark scaled into 64×64 box via nested viewBox.
    Source path is designed for a 100×100 space; the nested <svg>
    maps it down with preserveAspectRatio so it always centres cleanly.
  -->
  <svg x="0" y="0" width="64" height="64" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
    <path
      fill-rule="evenodd"
      fill="white"
      d="
        M 22,81
        L 22,19
        L 53,19
        C 76,19 76,55 53,55
        L 38,55
        L 38,81
        Z

        M 38,29
        L 53,29
        C 66,29 66,45 53,45
        L 38,45
        Z
      "
    />
  </svg>

  <!-- Wordmark: "Philomni" in white, vertically centred -->
  <text
    x="78"
    y="32"
    dominant-baseline="middle"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.5"
    fill="white"
  >Philomni</text>
</svg>
