<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Philomni">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6d28d9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#grad)" filter="url(#shadow)"/>

  <!--
    P lettermark — fill-rule="evenodd" subtracts the counter (inner hole) from the solid shape.

    Outer path  (the full P silhouette, clockwise):
      22,81 → up stem left → 22,19 → across top → 53,19
      → bowl outer curve (cubic bezier) → back to 53,55
      → across inner bowl bottom → 38,55
      → down stem right → 38,81 → close

    Counter path  (the enclosed negative space inside the bowl, clockwise):
      38,29 → across to 53,29 → right curve → 53,45 → back → 38,45 → close
  -->
  <path
    fill-rule="evenodd"
    fill="white"
    d="
      M 22,81
      L 22,19
      L 53,19
      C 76,19 76,55 53,55
      L 38,55
      L 38,81
      Z

      M 38,29
      L 53,29
      C 66,29 66,45 53,45
      L 38,45
      Z
    "
  />
</svg>
